[project]
name = "my-kb"
version = "0.1.0"
description = "Personal learning knowledge base with grep search and LLM Q&A"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
]

[project.scripts]
kb = "kb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kb"]
